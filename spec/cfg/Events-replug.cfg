\* The monitor on master: a reader unplugged and plugged back between waits restarts pcscd's counter, so a card swapped that way can be missed. Expect: CardsConvergeEvenAfterReplug violated.
SPECIFICATION Spec
CONSTANTS
    Readers = {r1}
    MaxEnvSteps = 6
    Design = "current"
INVARIANTS TypeOK WellFormed TrackedIsTold
PROPERTIES CardsConvergeEvenAfterReplug
