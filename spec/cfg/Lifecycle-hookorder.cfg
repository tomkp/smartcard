    MaxSessions = 2
    MaxChanges = 2
    QueueLimit = 0
    HasTimeout = TRUE
    Design = "current"
    WithTeardown = TRUE
    HookRunsFirst = FALSE
    SafeDelivery = TRUE
    WithGC = TRUE
INVARIANTS TypeOK NoCrash OneSession
PROPERTIES StopReturns DestroyReturns
