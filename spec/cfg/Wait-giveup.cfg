\* The code as it is, if the wait takes longer than cancel() keeps trying to reach the point where it can be cancelled. Expect: CancelEnds violated.
SPECIFICATION Spec
CONSTANTS
    MaxWaits = 1
    MaxEvents = 0
    MaxAttempts = 1
    Ops = {"cancel"}
    Design = "current"
    WithTeardown = FALSE
    HookRunsFirst = TRUE
INVARIANTS TypeOK NoCrash
PROPERTIES CancelEnds
CHECK_DEADLOCK FALSE
