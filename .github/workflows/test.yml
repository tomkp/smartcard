name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # pcscd lets tests that need a PC/SC service (but no reader) run.
      # Its polkit check refuses the runner's user, which has no local
      # session ("Security violation"), so run it without polkit.
      - name: Install PC/SC dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libpcsclite-dev pcscd
          sudo systemctl stop pcscd.socket pcscd.service
          sudo pcscd --disable-polkit

      - name: Install dependencies
        run: npm install

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Run native C++ tests
        run: npm run test:native
