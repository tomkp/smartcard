name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Nothing here writes to the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Shared with the sanitizers job below
        node: &node-versions [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # pcscd lets tests that need a PC/SC service run, and vsmartcard
      # gives it a virtual reader and card (test/virtual/README.md). pcscd's
      # polkit check refuses the runner's user, which has no local session
      # ("Security violation"), so run it without polkit.
      - name: Install PC/SC dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pcscd \
            vsmartcard-vpcd vsmartcard-vpicc python3-pycryptodome
          sudo systemctl stop pcscd.socket pcscd.service
          sudo pcscd --disable-polkit

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:unit

      - name: Run native C++ tests
        run: npm run test:native

      - name: Run virtual card tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          SMARTCARD_VIRTUAL_CARD_REQUIRED: 1
          SMARTCARD_TEST_RESTART_PCSCD: 1
        run: npm run test:virtual

      # Coverage on one job, after its tests: if the coverage tool can't
      # run, the tests have still run
      - name: Coverage (Linux, Node 24)
        if: runner.os == 'Linux' && matrix.node == 24
        run: npm run test:coverage

  # The tests again against an AddressSanitizer build of the addon, for
  # memory errors (use after free, overflows) and LeakSanitizer's leaks.
  # Node isn't built with ASan, so its runtime is preloaded into every
  # process; scripts/check-asan-logs.js then sorts the addon's problems
  # from Node's own exit-time leaks.
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: *node-versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install PC/SC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev pcscd \
            vsmartcard-vpcd vsmartcard-vpicc python3-pycryptodome
          sudo systemctl stop pcscd.socket pcscd.service
          sudo pcscd --disable-polkit

      # Without the install script's plain build of the addon
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build the addon with AddressSanitizer
        env:
          CFLAGS: -fsanitize=address -fno-omit-frame-pointer -g
          CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer -g
          LDFLAGS: -fsanitize=address
        run: npx node-gyp rebuild && npm run build:ts

      # exitcode=0: Node's own exit-time leaks would otherwise fail every
      # process; the next step judges the reports instead. abort_on_error:
      # a memory error still kills the process that hits it (SIGABRT), so
      # the tests fail too. allow_user_segv_handler=0 keeps ASan's SIGSEGV
      # handler (V8 installs its own), so a crash leaves a report. Freed
      # memory isn't scribbled (max_free_fill_size): that would also catch
      # uninstrumented Node code reading memory Node freed, but it turns a
      # Node bug into a crash at exit (node_napi_env__::DrainFinalizerQueue
      # running on its freed napi_env), which the addon can't fix.
      - name: Run the tests under AddressSanitizer
        timeout-minutes: 15
        env:
          SMARTCARD_VIRTUAL_CARD_REQUIRED: 1
          SMARTCARD_TEST_RESTART_PCSCD: 1
        run: |
          mkdir -p "$RUNNER_TEMP/asan"
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          export ASAN_OPTIONS="log_path=$RUNNER_TEMP/asan/asan:exitcode=0:abort_on_error=1:allow_user_segv_handler=0:handle_abort=1:detect_leaks=1:fast_unwind_on_malloc=0"
          node --test dist/test/unit/index.js
          node --test dist/test/virtual/index.js
          node dist/test/virtual/with-card.js node --test dist/test/integration/index.js

      - name: Check the sanitizer reports
        if: success() || failure()
        run: node scripts/check-asan-logs.js "$RUNNER_TEMP/asan" build/Release/smartcard_napi.node
