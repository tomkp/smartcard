name: Spec

# Model-check the TLA+ specs of the reader monitor and waitForChange()
# (spec/README.md). TLC reads only spec/, so this runs when the specs
# change. A change to src/reader_monitor.cpp, or to waitForChange() in
# src/async_workers.cpp and src/pcsc_context.cpp, should update the specs
# in the same PR.
on:
  push:
    branches: [master]
    paths:
      - 'spec/**'
      - '.github/workflows/spec.yml'
  pull_request:
    branches: [master]
    paths:
      - 'spec/**'
      - '.github/workflows/spec.yml'

# Nothing here writes to the repository
permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - name: Cache tla2tools.jar
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: spec/.tools
          key: tla2tools-${{ hashFiles('spec/tlc.sh') }}

      - name: Model-check
        run: spec/check.sh
